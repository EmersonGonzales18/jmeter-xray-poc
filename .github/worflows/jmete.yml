name: JMeter Performance Tests

on:
  workflow_dispatch:

jobs:
  jmeter-test:
    name: Ejecutar JMeter
    runs-on: ubuntu-latest

    steps:

      # 1. Descargar repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalar Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Descargar JMeter
      - name: Install JMeter 5.6.3
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

      # 4. Comprobar entorno
      - name: Verify environment
        run: |
          java -version
          jmeter --version

      # 5. Ejecutar JMeter
      - name: Run JMeter
        run: |
          mkdir -p results
          mkdir -p reports

          jmeter \
            -n \
            -t jmeter/test.jmx \
            -l results/results.jtl \
            -e \
            -o reports/jmeter-report

      # 6. Mostrar archivos generados
      - name: Verify results
        if: always()
        run: |
          echo "=== RESULTS ==="
          find results -type f || true

          echo "=== REPORT ==="
          find reports -type f || true

      # 7. Guardar resultados
      - name: Upload JMeter results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: |
            results/
            reports/
          retention-days: 7