name: JMeter Performance Tests

on:
  workflow_dispatch:

jobs:

  performance-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -----------------------------
      # Compilar nuestro Java
      # -----------------------------

      - name: Build Java Integrator
        run: mvn clean package

      # -----------------------------
      # Separar Thread Groups
      # -----------------------------

      - name: Detect Thread Groups
        run: |
          java -jar target/jmeter-xray-integrator-1.0.0.jar

          echo "JMX generados:"
          ls -la temp/

      # -----------------------------
      # Instalar JMeter
      # -----------------------------

      - name: Install JMeter 5.6.3
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz

          tar -xzf apache-jmeter-5.6.3.tgz

          echo "$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

      - name: Verify JMeter
        run: jmeter --version

      # -----------------------------
      # Ejecutar secuencialmente
      # -----------------------------

      - name: Run Thread Groups
        run: |

          mkdir -p results
          mkdir -p reports

          for jmx in temp/*.jmx
          do

            name=$(basename "$jmx" .jmx)

            echo ""
            echo "======================================"
            echo " Ejecutando: $name"
            echo "======================================"

            jmeter \
              -n \
              -t "$jmx" \
              -l "results/$name.jtl" \
              -e \
              -o "reports/$name"

            echo ""
            echo "Finalizado: $name"

          done

      # -----------------------------
      # Verificar
      # -----------------------------

      - name: Verify Reports
        if: always()
        run: |

          echo "======= JTL ======="
          find results -name "*.jtl" || true

          echo ""
          echo "======= REPORTES ======="
          find reports -name "index.html" || true

      # -----------------------------
      # Guardar artifacts
      # -----------------------------

      - name: Upload JMeter Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-thread-group-reports
          path: |
            results/
            reports/
          retention-days: 7