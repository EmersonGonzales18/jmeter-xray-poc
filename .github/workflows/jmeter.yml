name: JMeter Performance Tests

on:
  workflow_dispatch:

jobs:
  performance-tests:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. JAVA
      # ==========================================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ==========================================================
      # 3. COMPILAR JAVA
      # ==========================================================

      - name: Build Java Integrator
        run: mvn clean package

      # ==========================================================
      # 4. PREPARAR XRAY
      #
      # - Lee test.jmx
      # - Detecta Thread Groups
      # - Crea/reutiliza Tests
      # - Crea/actualiza Test Set
      # - Crea Test Plan
      # - Vincula Test Set -> Test Plan
      # - Vincula Test Plan -> Historia
      # - Guarda contexto en target/
      # ==========================================================

      - name: Prepare Jira Xray
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
        run: |
          mvn exec:java \
            -Dexec.mainClass=com.jmeterxray.JMeterXrayOrchestrator \
            -Dexec.args=prepare

      # ==========================================================
      # 5. SEPARAR THREAD GROUPS
      # ==========================================================

      - name: Detect Thread Groups
        run: |
          java -jar target/jmeter-xray-integrator-1.0.0.jar

          echo ""
          echo "===== JMX GENERADOS ====="
          ls -la temp/

      # ==========================================================
      # 6. INSTALAR JMETER
      # ==========================================================

      - name: Install JMeter 5.6.3
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz

          tar -xzf apache-jmeter-5.6.3.tgz

          echo "$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

      - name: Verify JMeter
        run: jmeter --version

      # ==========================================================
      # 7. EJECUTAR THREAD GROUPS SECUENCIALMENTE
      # ==========================================================

      - name: Run Thread Groups
        run: |

          mkdir -p results
          mkdir -p reports

          for jmx in temp/*.jmx
          do

            name=$(basename "$jmx" .jmx)

            echo ""
            echo "======================================"
            echo " Ejecutando: $name"
            echo "======================================"

            jmeter \
              -n \
              -Jjmeter.save.saveservice.output_format=xml \
              -t "$jmx" \
              -l "results/$name.jtl" \
              -e \
              -o "reports/$name"

            exit_code=$?

            echo ""
            echo "JMeter exit code: $exit_code"
            echo "Finalizado: $name"

          done

      # ==========================================================
      # 8. VERIFICAR RESULTADOS
      # ==========================================================

      - name: Verify Reports
        if: always()
        run: |

          echo ""
          echo "======= JTL ======="

          find results -name "*.jtl" || true

          echo ""
          echo "======= REPORTES HTML ======="

          find reports -name "index.html" || true

          echo ""
          echo "======= CONTEXTO XRAY ======="

          if [ -f target/jmeter-xray-context.properties ]; then
            cat target/jmeter-xray-context.properties
          else
            echo "No existe contexto Xray"
          fi

      # ==========================================================
      # 9. PUBLICAR TEST EXECUTIONS EN XRAY
      #
      # - Lee target/jmeter-xray-context.properties
      # - Lee cada JTL
      # - Determina PASSED / FAILED
      # - Crea Test Execution
      # - Actualiza Test Run
      # - Asocia Test Execution -> Test Plan
      # ==========================================================

      - name: Publish Xray Test Executions
        if: always()
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
        run: |
          mvn exec:java \
            -Dexec.mainClass=com.jmeterxray.JMeterXrayOrchestrator \
            -Dexec.args=publish-results

      # ==========================================================
      # 10. GUARDAR REPORTES
      # ==========================================================

      - name: Upload JMeter Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-thread-group-reports
          path: |
            results/
            reports/
          retention-days: 7